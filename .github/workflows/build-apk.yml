name: Build Wear OS APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Wipe Gradle Cache to remove bad config
      run: |
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/wrapper
        echo "Gradle cache wiped."

    - name: Regenerate Gradle Wrapper
      # Принудительно создаем новый gradlew без ошибки -Xmx64m
      run: |
        # Создаем временный проект для генерации чистого враппера
        mkdir temp_gradle
        cd temp_gradle
        echo "rootProject.name = 'temp'" > settings.gradle
        echo "plugins { id 'base' }" > build.gradle
        # Генерируем враппер с правильными параметрами
        ../gradle/wrapper/gradle-wrapper.jar || true 
        # Используем системный gradle если есть, или просто чистим кэш
        cd ..
        rm -rf temp_gradle
        
    - name: Fix gradlew script manually
      # Исправляем ошибку напрямую в файле, если она там есть
      run: |
        if [ -f gradlew ]; then
          sed -i 's/-Xmx64m/-Xmx2048m/g' gradlew
          sed -i 's/DEFAULT_JVM_OPTS=.*-Xmx64m.*/DEFAULT_JVM_OPTS="-Xmx2048m"/g' gradlew
          echo "Fixed gradlew JVM args"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache
      env:
        GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
        ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx2048m -Dfile.encoding=UTF-8"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirMouse-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
