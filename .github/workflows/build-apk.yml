name: Build Wear OS APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cleanup Gradle Cache
      run: |
        rm -rf /home/runner/.gradle/caches
        rm -rf /home/runner/.gradle/wrapper

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache
      env:
        GRADLE_OPTS: "-Xmx2048m"
        ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx2048m"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirMouse-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
